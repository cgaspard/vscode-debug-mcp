name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc -p . --noEmit
      - run: npm run test:unit
      # E2E launches a real VS Code; Linux needs a virtual framebuffer.
      - run: xvfb-run -a npm run test:e2e
      - run: npx vsce package --out vscode-debug-mcp-dev.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-debug-mcp-dev-vsix
          path: vscode-debug-mcp-dev.vsix
          if-no-files-found: error
          retention-days: 7
