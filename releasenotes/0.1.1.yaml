version: 0.1.1
date: 2026-05-24
highlights:
  - Multi-window support — a single MCP server now handles all open VS Code windows. The leader window owns the HTTP server, follower windows register over a local socket, and the AI picks which window to target with the new list_workspaces / bind_workspace tools.
  - Single .mcp.json points at one URL and works for every workspace you have open.
added:
  - Cluster IPC layer (Unix-socket-based) that lets multiple VS Code windows share a single MCP HTTP server.
  - list_workspaces MCP tool — returns every registered VS Code window with a stable id (sha256 hash slice of its path), name (folder basename), and absolute path.
  - bind_workspace MCP tool — binds the current MCP chat session to a specific workspace. Subsequent calls in that session route to that window.
  - Leader-shutdown failover — when the leader window closes, followers race to grab the port and promote themselves.
  - Status bar now shows role — '(leader)', '(follower)', or unadorned (standalone single-window).
  - Skill updated to teach the AI to call list_workspaces / bind_workspace at the start of multi-window sessions.
changed:
  - When no bind_workspace has been made, MCP tool calls default to the leader window's workspace. Single-window users see no behavior change.
fixed:
  - EADDRINUSE crash when opening Debug MCP in a second VS Code window — second window now joins as a follower instead of failing to start.
removed: []
